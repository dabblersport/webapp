<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dabbler app.">

  <!-- iOS meta tags & icons -->
  <!-- Safari Smart App Banner: uncomment once the app is live on the App
       Store and replace APP_ID with the numeric App Store id. Safari then
       shows a native "open in app / install" banner on every page, deep
       linking into the same path (app-argument).
  <meta name="apple-itunes-app" content="app-id=APP_ID">
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS ignores theme-color: "default" keeps the status bar on a light/dark
       system ground that matches the page instead of forcing black. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dabbler">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dabbler</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Sign-In API for web -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!--
    Launch background #7328CE: the splash video's ground (its first frame
    decodes to #7228CC) and the design-system token DabblerPalette.mainP600.
    Painted before Flutter loads so launch -> splash video has no flash.
  -->
  <style>
    html, body { margin: 0; background-color: #7328CE; }
  </style>
  <!--
    theme-color is the launch purple only while the splash plays. When the app
    is showing (and on every theme toggle) lib/core/system_ui replaces this
    meta and the html/body background with the page ground: #F5F0E6
    (DabblerPalette.surfacePage) in light, #141414 (DabblerPalette.ink) in dark.
  -->
  <meta name="theme-color" content="#7328CE">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
