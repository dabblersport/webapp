<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dabbler app.">

  <!-- iOS meta tags & icons -->
  <!-- Safari Smart App Banner: uncomment once the app is live on the App
       Store and replace APP_ID with the numeric App Store id. Safari then
       shows a native "open in app / install" banner on every page, deep
       linking into the same path (app-argument).
  <meta name="apple-itunes-app" content="app-id=APP_ID">
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS ignores theme-color: "default" keeps the status bar on a light/dark
       system ground that matches the page instead of forcing black. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dabbler">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dabbler</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Sign-In API for web -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!--
    System-bar colours, correct from the first byte. Safari tints the status bar
    and the bottom toolbar from the FIRST theme-color meta it parses and from the
    html/body background, and does not reliably re-tint after a later script
    swap, so these are static: the page ground, per scheme.
      light  #F5F0E6 = DabblerPalette.surfacePage (DabblerColors.bgPrimary, light)
      dark   #141414 = DabblerPalette.ink         (DabblerColors.bgPrimary, dark)
    lib/core/system_ui keeps both in step with the in-app theme toggle (which can
    differ from the OS).

    The Flutter startup splash (assets/Splash.lottie) draws the same two
    grounds inside the viewport, so web launch -> animation has no seam. There
    is no purple interstitial and no startup video.
  -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F0E6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; background-color: #F5F0E6; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #141414; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
