# KAN-506 (T10) messaging Worker skeleton. LOCAL ONLY: nothing is created or deployed in KAN-506.
# No account id, no routes, no R2, no secrets in this file.
name = "dabbler-messaging-skeleton"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# KAN-554: keep variables edited in the Cloudflare dashboard on deploy (top-level only; it cannot sit inside
# [env.production]). This is what lets the kill switch (MESSAGING_ACCESS_MODE edited in the dashboard) survive a
# later `wrangler deploy --env production`. See README, "Kill switch".
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "messaging-local"
migrations_dir = "migrations"
# database_id intentionally absent: nothing is created or deployed in KAN-506

[vars]
# Placeholder only. The real Supabase URL is supplied by the environment, never committed.
SUPABASE_URL = "https://example.invalid"
# SUPABASE_ANON_KEY: variable NAME only. Supply it from the local environment (e.g. .dev.vars, gitignored
# by the developer); no value is ever written in this repository.

# KAN-534, renamed staging -> production by KAN-546: production. FREE tier only. Nothing is deployed by this file; no route, no custom domain, no R2, no cron.
# The account id comes from the environment (CLOUDFLARE_ACCOUNT_ID), never from this file.
# Reached only at https://dabbler-messaging-staging.dabbler-sport.workers.dev (workers_dev). SKELETON_PROBE is not set.
# The Worker name below keeps its historical "-staging" suffix on purpose: renaming it would orphan its secrets and
# change the app's base URL. Deploy: `npx wrangler deploy --env production` (see README).
[env.production]
name = "dabbler-messaging-staging"
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "dabbler-messaging-staging"
database_id = "299ff24f-f413-4a54-a032-33d81f438a3f"
migrations_dir = "migrations"

[env.production.vars]
# The public Supabase project URL (not a secret). The anon key is a secret binding: name only, supplied outside the repo.
SUPABASE_URL = "https://wtncuzcskpigqpmnxwws.supabase.co"
# KAN-581: aligned to the live dashboard value ("all", confirmed by the CEO 2026-10-22) so a deploy cannot reset it.
MESSAGING_ACCESS_MODE = "all"
MESSAGING_UPLOADS = "on"

# KAN-581: private message images. The CEO approved R2 (KAN-581 comment 13540) and operations created the PRIVATE bucket
# dabbler-messaging-media (no r2.dev URL, no custom domain; bytes are served only through the Worker after authorisation).
# Without the MEDIA binding every attachment route answers 503. MESSAGING_UPLOADS = "off" is the upload kill switch
# (dashboard variable); "on" is the enabled value.
[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "dabbler-messaging-media"
