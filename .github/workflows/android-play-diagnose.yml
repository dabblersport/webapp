# KAN-568 / KAN-572: read-mostly diagnosis of a Google Play API refusal (403 on edits.commit).
# Runs ONLY by pushing a ref to the branch `android-play-diagnose` or by Run workflow. It never builds, uploads a
# bundle, changes a track or touches production: it lists what Play holds, records the full error body of any refusal
# and makes one harmless empty-edit commit probe. See scripts/android/play_diagnose.py. Prints no secret.
name: Android Play diagnose

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional versionCode to look for on every track"
        type: string
        required: false
  push:
    branches:
      - android-play-diagnose

permissions:
  contents: read

concurrency:
  group: android-play-diagnose
  cancel-in-progress: false

env:
  ANDROID_PACKAGE: com.dabbler.dabblerapp

jobs:
  diagnose:
    name: Diagnose the Play API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Play API client
        run: python -m pip install --disable-pip-version-check -r scripts/android/requirements.txt

      - name: Offline checks
        run: python scripts/android/test_play_diagnose.py
        working-directory: scripts/android

      - name: Write the service-account file (runner only)
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SA_JSON" ]] || { echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_CREDENTIALS=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Diagnose
        env:
          VCODE: ${{ inputs.version_code || '177' }}
        run: |
          set -euo pipefail
          python scripts/android/play_diagnose.py --package "$ANDROID_PACKAGE" --version-code "$VCODE" \
            --credentials "$PLAY_CREDENTIALS" | tee "$RUNNER_TEMP/play-diagnose.json"
          {
            echo "### Google Play diagnosis"
            echo '```json'
            cat "$RUNNER_TEMP/play-diagnose.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the service-account file
        if: always()
        run: rm -f "$RUNNER_TEMP/play-sa.json" || true
