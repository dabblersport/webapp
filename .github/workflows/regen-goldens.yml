name: regen-goldens
on:
  push:
    branches: [staging-memphis]
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test --update-goldens test/features/ratings/rating_summary_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: test/features/ratings/goldens/
